# One robot's client as a long-running service
services:
  client:
    build:
      # The parent of both checkouts, because the Dockerfile copies the contract from there.
      context: ../..
      dockerfile: leitstand-robot-client-template/docker/Dockerfile
      args:
        ROS_DISTRO: ${ROBOT_ROS_DISTRO:?set it in docker/.env, see docker/.env.example}
    image: leitstand-client:${ROBOT_ROS_DISTRO}
    # DDS discovery and shared-memory transport both need the host's network and IPC namespaces.
    network_mode: host
    ipc: host
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      LEITSTAND_LOG_LEVEL: ${LEITSTAND_LOG_LEVEL:-INFO}
    command: ["ros2", "launch", "leitstand_client_ros2", "client.launch.py", "config:=/config/${ROBOT_CONFIG_FILE:?set it in docker/.env, see docker/.env.example}"]
    volumes:
      - type: bind
        source: ${ROBOT_CONFIG_DIR:?set it in docker/.env, see docker/.env.example}
        target: /config
        read_only: true
        bind: { create_host_path: false }
