name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint and unit tests need no ROS.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m venv .venv && .venv/bin/pip install --upgrade pip
      # The contract tag is read from leitstand.repos file, the pin vcs import uses.
      - run: |
          ref=$(sed -n '/leitstand-robot-contract:/,/version:/s/^ *version: *//p' leitstand.repos)
          .venv/bin/pip install "git+https://github.com/AI-RLA/leitstand-robot-contract.git@${ref}" -r leitstand_client/requirements.txt -r requirements-dev.txt
      - run: make lint PYTHON=.venv/bin/python
      - run: make test PYTHON=.venv/bin/python
      - run: make contract-check PYTHON=.venv/bin/python

  colcon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, lyrical]
    container: ros:${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: src/leitstand-robot-client-template
      - run: apt-get update && rosdep update && rosdep install --from-paths src --ignore-src -y
      - run: . /opt/ros/${{ matrix.distro }}/setup.sh && colcon build --symlink-install
